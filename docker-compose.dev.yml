services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fastapi-todo-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides or container-specific settings
      - DATABASE_URL=sqlite:///./data/todos.db
      # Fix OTLP endpoint for Docker on Mac/Windows (localhost -> host.docker.internal)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
    volumes:
      - ./app:/app/app:cached
      - ./data:/app/data
    restart: unless-stopped
    command: [ "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000" ]
