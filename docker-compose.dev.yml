services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fastapi-todo-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app:cached
      - ./data:/app/data
    restart: unless-stopped
    command: [ "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000" ]
