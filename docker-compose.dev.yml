services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fastapi-todo-dev
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=FastAPI Todo Starter (Dev)
      - DEBUG=true
      - DATABASE_URL=sqlite:///./data/todos.db
    volumes:
      - ./app:/app/app:cached
      - ./data:/app/data
    restart: unless-stopped
    command: [ "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000" ]
